---
name: Signed Release

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: >-
            ${{ github.event_name == 'release' &&
            github.event.release.tag_name || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: "gradle/actions/setup-gradle@9c971963bec38e04b3d30\
          dcc455b5382be2fdbfb"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/AnimeMiTV.jks"
          chmod 600 "$RUNNER_TEMP/AnimeMiTV.jks"
          keystore_path="$RUNNER_TEMP/AnimeMiTV.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify and package release APK
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)
          metadata="app/build/outputs/apk/release/output-metadata.json"
          test -f "$metadata"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          grep -Fq "$version" "$metadata"
          echo "Release tag and APK version: $version"
          output="AnimeMiTV-$version.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"
          echo "APK_PATH=$output" >> "$GITHUB_ENV"
          echo "SHA_PATH=$output.sha256" >> "$GITHUB_ENV"

      - name: Upload APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" --clobber
